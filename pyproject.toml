[project]
name = "forage"
version = "0.1.0"
description = "Forage — extraction and telemetry service for safe web access by LLM agents"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "WashingBearLabs" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=2.0.0",
    "pypdf>=5.0.0",
    "redis>=5.0.0",
    "pyyaml>=6.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pyright>=1.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The service keeps a flat module layout (no `forage/` package directory —
# that rename is deferred), so hatchling's name-matching heuristic finds
# nothing to ship and errors out. List the modules explicitly instead, the
# same fix Poppy's root pyproject.toml uses for its `packages = ["poppy"]`.
[tool.hatch.build.targets.wheel]
include = [
    "retrieval_app.py",
    "models.py",
    "cache.py",
    "url_validator.py",
    "pipeline",
    "promptguard",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
