[project]
name = "forage"
version = "0.1.0"
description = "Forage — extraction and telemetry service for safe web access by LLM agents"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "WashingBearLabs" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=2.0.0",
    "pypdf>=5.0.0",
    "redis>=5.0.0",
    "pyyaml>=6.0",
    "transformers>=4.40.0",
    # Direct since `feature-forage-model-bootstrap` US-001: `model_fetcher.py`
    # calls `snapshot_download` itself. It has always been present as a
    # transitive dependency of `transformers`, but a module that imports a
    # package must declare it — a transitive pin is someone else's to drop.
    "huggingface_hub>=1.30.0",
    "torch>=2.2.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.7.0",
    "httpx>=0.27.0",
    "pyright>=1.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Torch resolves to the CPU build on Linux. Plain PyPI drags in 15 `nvidia-*`
# CUDA packages (~2.7 GB) that no Forage lane needs: the image installs torch
# from the CPU index itself and never reads this lock, so the CUDA payload
# would only ever cost developer `uv sync`s and CI jobs. macOS/Windows wheels
# are already CPU-only on PyPI, hence the `sys_platform == 'linux'` marker.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

# The service keeps a flat module layout (no `forage/` package directory —
# that rename is deferred), so hatchling's name-matching heuristic finds
# nothing to ship and errors out. List the modules explicitly instead, the
# same fix Poppy's root pyproject.toml uses for its `packages = ["poppy"]`.
[tool.hatch.build.targets.wheel]
include = [
    "retrieval_app.py",
    "models.py",
    "cache.py",
    "url_validator.py",
    "model_fetcher.py",
    "weights_manifest.json",
    "pipeline",
    "promptguard",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# `# type: ignore` is not a fix, and pyright honours it by default — with no
# rule code required, so one such comment silences *every* diagnostic on its
# line. Turning it off is what makes "pyright exits 0" mean something here:
# the repo's real backlog at the start of US-006 was 269 errors, of which 55
# were hidden behind 39 inherited `# type: ignore` comments. With the switch
# off they cannot creep back unnoticed. A genuinely unavoidable case would
# need a narrow `# pyright: ignore[ruleName]`, which still works and which
# tests/test_pyright_policy.py counts — currently zero, repo-wide.
enableTypeIgnoreComments = false
# Local stubs for third-party packages whose shipped types leave holes in the
# symbols Forage actually calls. Each stub declares only what this repo uses —
# see typings/README.md for the rule and the reason it is a rule.
stubPath = "typings"

# --- Type-checking policy (forage-ci-and-image US-006) --------------------
# Service code is strict with no carve-outs at all: every rule below the
# `strict` preset applies to retrieval_app.py, models.py, cache.py,
# url_validator.py, pipeline/ and promptguard/, and the backlog was burned to
# zero rather than baselined.
#
# `tests/` gets exactly one rule-level relaxation, `reportPrivateUsage`, and
# nothing else. Unit tests legitimately reach for the private surface of the
# module under test — `cache._closed_vocabulary_reason`, an orchestrator's
# `_client`, `retrieval_app._load_config` — and the alternative to allowing
# that is either widening the service's public API purely to satisfy a type
# checker, or sprinkling per-line suppressions through the suite. Both are
# worse than one documented, narrowly-scoped rule. Every *other* strict rule
# stays on for tests: unknown types, missing annotations and bad arguments are
# real defects in a test just as they are in the service.
#
# Adding a second relaxation here is a policy change, not a fix — and
# tests/test_pyright_policy.py will fail until this comment is updated to say
# why.
[[tool.pyright.executionEnvironments]]
root = "tests"
# An execution environment replaces the default import root, and Forage's
# modules are flat at the repo root (`from cache import ...`), so hand it back
# — otherwise every first-party import in the suite resolves as a stub-less
# third-party library. This mirrors what tests/conftest.py does at runtime.
extraPaths = ["."]
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "."
