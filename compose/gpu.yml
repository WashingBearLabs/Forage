# compose/gpu.yml — an OVERLAY that gives the `forage` service one NVIDIA GPU.
#
# It is not a deployment on its own: it has no image and no ports, and is
# merged onto `minimal.yml` or `full.yml`. The tag is the same one the base
# pins — one image serves both device classes.
#
#   cd compose
#   docker compose -f minimal.yml -f gpu.yml up -d     # or: -f full.yml -f gpu.yml
#   curl -s localhost:8020/health | jq '{promptguard_device, degraded_reasons}'
#
# Needs a host NVIDIA driver >= 580 (cu130), the NVIDIA Container Toolkit and
# Docker Compose >= 2.30. A missing Toolkit fails at `compose up`, not as a
# degraded boot. docs/configuration.md § "Installing on a GPU host" is the
# install guide.
#
# FORAGE_DEVICE_FALLBACK is the operator's choice, read from `.env` or the
# shell so this file never needs editing: `cpu` (default) runs the classifier
# on CPU, degraded, when the GPU is unusable; `refuse` will not start without
# one.
#
# The GPU is a shared, non-isolated resource and its memory is not reserved.
# Do not use this on a multi-tenant host, and keep the loopback binding.
#
# `mem_limit` is PROVISIONAL: the CUDA context and libraries add host RSS, and
# the feature-gpu-validation spec measures the real figure on a GPU host and
# adjusts this default. Set FORAGE_MEM_LIMIT to override it.

services:
  forage:
    environment:
      FORAGE_DEVICE: cuda
      FORAGE_DEVICE_FALLBACK: ${FORAGE_DEVICE_FALLBACK:-cpu}
    mem_limit: ${FORAGE_MEM_LIMIT:-3072m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
