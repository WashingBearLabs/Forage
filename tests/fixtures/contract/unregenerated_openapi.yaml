# Generated by scripts/export_contract.py — do not edit by hand.
#
# The drift check's own failure case, kept committed rather than staged by
# hand: this is contract/openapi.yaml with Extract422ErrorResponse's
# sanitizer_revision property removed — an un-regenerated response-model
# change. tests/test_contract_export.py asserts the checker catches it.
# Regenerate with: uv run python -m scripts.export_contract
components:
  schemas:
    Admission413Response:
      additionalProperties: false
      description: '``POST /extract`` streaming size refusal — the 413 shape.


        :class:`DocumentSizeLimitMiddleware` rejects the request while its ASGI

        body is still streaming, before any handler or request id exists. That is

        why this body carries **no** ``request_id`` where every other coded error

        does — the difference is real, not an oversight to be tidied away.'
      properties:
        error:
          const: content_too_large
          description: Always 'content_too_large' at this status.
          title: Error
          type: string
        reason:
          description: Fixed, content-free user message for the size limit.
          title: Reason
          type: string
      required:
      - error
      - reason
      title: Admission413Response
      type: object
    Body_extract_extract_post:
      properties:
        extract_mode:
          default: full
          enum:
          - summary
          - full
          title: Extract Mode
          type: string
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        filename:
          title: Filename
          type: string
        mime_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Hint
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        timeout_s:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          title: Timeout S
      required:
      - file
      - filename
      title: Body_extract_extract_post
      type: object
    CacheMetricsResponse:
      additionalProperties: false
      description: 'The ``cache`` section of ``GET /metrics``.


        Two layers share this response and are not duplicates of each other.

        ``retrieve.cache_hits``/``cache_misses`` count *request* outcomes; the

        ``storage_*`` counters here count *storage operations* underneath the

        cache''s policy layer, so a zero-TTL purge or a policy-stale entry moves

        one and not the other. Only the in-memory storage can move

        ``storage_evictions``; ``storage_oversize_skips`` counts Forage''s own

        write-side refusals on both backends.'
      properties:
        corrupt_entries:
          description: Stored values that failed RetrievedContent JSON or schema validation
            and were treated as misses, with deletion attempted. Counts parse failures, not
            tampering; parse success does not prove authenticity.
          title: Corrupt Entries
          type: integer
        integrity_rejects:
          description: Stored values rejected before parsing for an invalid or unexpected
            signature envelope, an oversized value, or a wrong Valkey type. Deletion is attempted
            and the read becomes a miss. Key changes and lowered byte bounds can also move
            this counter; inspect the closed reason token and cache-key digest in cache_integrity_reject
            logs.
          title: Integrity Rejects
          type: integer
        operation_failures:
          description: Cache operations that failed against the backend.
          title: Operation Failures
          type: integer
        reconnect_attempts:
          description: Reconnects attempted to the backend.
          title: Reconnect Attempts
          type: integer
        reconnect_failures:
          description: Reconnects that failed.
          title: Reconnect Failures
          type: integer
        reconnect_successes:
          description: Reconnects that restored the backend.
          title: Reconnect Successes
          type: integer
        storage_evictions:
          description: Entries the in-memory storage dropped to stay inside its bounds. Always
            0 on Valkey.
          title: Storage Evictions
          type: integer
        storage_hits:
          description: Key lookups that found live bytes.
          title: Storage Hits
          type: integer
        storage_misses:
          description: Key lookups that found nothing, an aged-out entry included.
          title: Storage Misses
          type: integer
        storage_oversize_skips:
          description: Values Forage refused to store over cache.max_value_bytes on either
            backend, or over the memory backend's cache.max_bytes bound.
          title: Storage Oversize Skips
          type: integer
      required:
      - reconnect_attempts
      - reconnect_successes
      - reconnect_failures
      - operation_failures
      - storage_hits
      - storage_misses
      - storage_evictions
      - storage_oversize_skips
      - corrupt_entries
      - integrity_rejects
      title: CacheMetricsResponse
      type: object
    DetailResponse:
      additionalProperties: false
      description: 'The bare ``{"detail": ...}`` body, as FastAPI''s ``HTTPException`` emits
        it.


        Used by ``/extract`` for the release-gate 404 and the two admission 503s.

        These three carry no ``error`` code at all — they are pre-pipeline

        conditions rather than document failures, and homogenizing them into the

        coded envelope would be a wire change this spec forbids.'
      properties:
        detail:
          description: 'Short reason phrase: ''Not Found'' (404) or ''Unavailable'' (503).'
          title: Detail
          type: string
      required:
      - detail
      title: DetailResponse
      type: object
    Extract422ErrorResponse:
      additionalProperties: false
      description: '``POST /extract`` document failure — the 422 ``PipelineError`` shape.


        Emitted by :func:`pipeline_error_handler`, which appends

        ``sanitizer_revision`` on ``/extract`` paths only. That fourth field is a

        hard requirement of Poppy''s client, which rejects a 422 without it as a

        protocol failure (``poppy/core/retrieval/client.py``), so it is documented

        here as required rather than left to be discovered from a rejection.'
      properties:
        error:
          description: Stable machine-readable failure code.
          enum:
          - content_too_large
          - content_too_large_to_classify
          - extraction_failed
          - invalid_filename
          - invalid_mime_hint
          - invalid_request_id
          - pdf_encrypted
          - pdf_no_text
          - unsupported_format
          title: Error
          type: string
        reason:
          description: Fixed, content-free user message for this code.
          title: Reason
          type: string
        request_id:
          description: Sidecar-generated id for correlating logs with this failure.
          title: Request Id
          type: string
      required:
      - error
      - reason
      - request_id
      title: Extract422ErrorResponse
      type: object
    ExtractedContent:
      description: 'Sanitized content returned for an uploaded document.


        This upload-only wire model deliberately does not reuse

        :class:`RetrievedContent`: uploads have no URL provenance.'
      properties:
        body:
          description: Sanitized extracted document text
          title: Body
          type: string
        content_type:
          description: 'Source format: ''pdf'' or ''text'''
          title: Content Type
          type: string
        injection_detected:
          default: false
          description: Whether prompt injection was detected
          title: Injection Detected
          type: boolean
        injection_spans:
          description: Detected injection text spans
          items:
            type: string
          title: Injection Spans
          type: array
        promptguard_state:
          default: scanned
          description: 'How PromptGuard examined this content: scanned, skipped_trusted, structural_blocked,
            unavailable_blocked, or unavailable_allowed'
          enum:
          - scanned
          - skipped_trusted
          - structural_blocked
          - unavailable_blocked
          - unavailable_allowed
          title: Promptguard State
          type: string
        provenance:
          $ref: '#/components/schemas/UploadProvenance'
        request_id:
          description: Extraction request ID
          minLength: 1
          title: Request Id
          type: string
        sanitizer_revision:
          description: Derived sanitization pipeline revision
          minLength: 1
          title: Sanitizer Revision
          type: string
        stage2_verdict:
          $ref: '#/components/schemas/Stage2Verdict'
          description: Stage-2 structural heuristic verdict
        stage3_verdict:
          $ref: '#/components/schemas/Stage3Verdict'
          description: Stage-3 PromptGuard ML verdict
        structural_flags:
          description: Structural heuristic flags raised
          items:
            type: string
          title: Structural Flags
          type: array
        title:
          anyOf:
          - type: string
          - type: 'null'
          description: Extracted document title
          title: Title
        truncation_notice:
          anyOf:
          - type: string
          - type: 'null'
          description: Describes what was omitted when extract_mode='summary'
          title: Truncation Notice
        trust_score:
          description: Composite trust score (0.0-1.0)
          maximum: 1.0
          minimum: 0.0
          title: Trust Score
          type: number
        trust_tier:
          $ref: '#/components/schemas/TrustTier'
          description: Resolved trust tier
        word_count:
          description: Word count of body
          minimum: 0.0
          title: Word Count
          type: integer
      required:
      - request_id
      - body
      - word_count
      - content_type
      - trust_score
      - trust_tier
      - stage2_verdict
      - stage3_verdict
      - provenance
      - sanitizer_revision
      title: ExtractedContent
      type: object
    ExtractionMetricsResponse:
      additionalProperties: false
      description: 'The ``extraction`` section of ``GET /metrics``.


        The three cgroup/OOM fields are **flat members of this section, not a

        nested object**: the handler splats ``_cgroup_memory_snapshot()`` in, and

        has since the fields existed. The model mirrors that flattening rather

        than tidying it — nesting them would be a wire change, and

        ``tests/test_app.py``''s ``oom_proximity_ratio in extraction`` assertion is

        the fossil guard that says so.'
      properties:
        active:
          description: Extraction slots in use right now.
          title: Active
          type: integer
        busy_rejections:
          description: Requests refused with 429 because the bounded admission queue was full
            or its byte reservation would have been exceeded.
          title: Busy Rejections
          type: integer
        cgroup_memory_current_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: cgroup v2 memory.current for this container, or null where no cgroup
            v2 memory controller is readable (a plain host, macOS).
          title: Cgroup Memory Current Bytes
        cgroup_memory_max_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          description: cgroup v2 memory.max, or null when unreadable or literally 'max' (no
            limit set).
          title: Cgroup Memory Max Bytes
        oom_proximity_ratio:
          anyOf:
          - type: number
          - type: 'null'
          description: current/max as a fraction, or null when either side is null or max
            is zero. The concrete OOM-proximity signal an operator reads.
          title: Oom Proximity Ratio
        promptguard_contiguity_detections:
          description: Uploads blocked by the contiguity rule, including both-rule verdicts.
          title: Promptguard Contiguity Detections
          type: integer
        queued:
          description: Requests waiting for a slot right now.
          title: Queued
          type: integer
        queued_bytes:
          description: Upload bytes conservatively reserved for the queued requests — the
            per-request maximum, not a measured size.
          title: Queued Bytes
          type: integer
        requests:
          description: Extraction attempts that reached the handler, successes included.
          title: Requests
          type: integer
        semaphore_saturation:
          description: Requests that found every extraction slot busy. Counts queueing as
            well as rejection, so it is always >= busy_rejections.
          title: Semaphore Saturation
          type: integer
        verdicts:
          additionalProperties:
            type: integer
          description: 'Content-free outcomes by key: ''success'', ''injection_detected'',
            or the error code of a document failure. Additive-safe, like HealthResponse.capabilities
            — read the keys you know.'
          title: Verdicts
          type: object
      required:
      - requests
      - busy_rejections
      - semaphore_saturation
      - active
      - queued
      - queued_bytes
      - verdicts
      - cgroup_memory_current_bytes
      - cgroup_memory_max_bytes
      - oom_proximity_ratio
      - promptguard_contiguity_detections
      title: ExtractionMetricsResponse
      type: object
    HTTPValidationError:
      description: 'The service''s redacted 422 body for a malformed request.


        Mirrored here because declaring a 422 response stops FastAPI auto-adding

        its own — verified against the locked FastAPI in

        ``tests/test_contract_errors.py``. The request-validation handler emits

        this body before any pipeline code runs. Every declared 422 is therefore

        a union of the route''s pipeline shape and this one.'
      properties:
        detail:
          default: []
          description: One entry per failed field, at most _MAX_VALIDATION_ERRORS (100) entries
            (GOVERNANCE ruling (l)).
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      description: 'Response body for ``GET /health``.


        HTTP status is always 200, even when ``status == "degraded"`` (family

        decision 11). The compose healthcheck''s ``curl -fsS -o /dev/null`` inspects

        only the HTTP status and discards the body: liveness, not health. Consumers

        must read ``status`` and ``degraded_reasons`` in the body; a Docker-healthy

        container may still have its classifier unloaded.'
      properties:
        cache_backend:
          description: 'Which storage the content cache selected at start: ''valkey'' when
            VALKEY_URL was set, ''memory'' when it was fully unset. Added in contract 1.1.0.'
          enum:
          - valkey
          - memory
          title: Cache Backend
          type: string
        cache_connected:
          description: 'Whether the selected cache backend is operational. In Valkey mode
            this is a live ping, subject to reconnect backoff. In memory mode it is always
            true: the backend is in this process and there is no connection to lose. It is
            not a statement that Valkey is present — read cache_backend for that.'
          title: Cache Connected
          type: boolean
        capabilities:
          additionalProperties:
            type: integer
          description: 'Capabilities this deployment advertises, as a presence map: a key
            is present with the value 1 when the capability is available and absent otherwise.
            Three keys are defined in contract 1.3.0. ''search_sanitization'' (contract 1.1.0)
            is a runtime claim, present when PromptGuard is loaded — or when the break-glass
            override is armed; see docs/configuration.md, which only ever forces this key.
            ''brave_api_key'' (contract 1.2.0) is an environment fact, present when this start
            resolved a usable FORAGE_BRAVE_API_KEY, independently of whether ''brave'' actually
            appears in search_providers and untouched by the break-glass override. ''cache_hmac_key''
            (contract 1.3.0) is present only when this start resolved a usable FORAGE_CACHE_HMAC_KEY
            and selected the Valkey backend, independently of cache connectivity and untouched
            by the break-glass override. Memory mode does not sign and never advertises it.
            Deliberately a dict rather than an enum: a consumer reads the keys it knows and
            ignores the rest, so a future capability is an additive-safe MINOR change.'
          title: Capabilities
          type: object
        contract_version:
          title: Contract Version
          type: string
        degraded_reasons:
          default: []
          description: Why status is 'degraded', as closed-vocabulary reason codes. Empty
            exactly when status is 'healthy'. The members are derived from contract.DegradedReason,
            which is also what this field is validated against on the way out — so a reason
            added to the handler without being added to the alias fails response validation
            loudly instead of reaching a consumer unannounced.
          items:
            enum:
            - promptguard_unavailable
            - cache_unavailable
            - cache_unauthenticated
            type: string
          title: Degraded Reasons
          type: array
        promptguard_loaded:
          title: Promptguard Loaded
          type: boolean
        promptguard_model:
          description: The model id selected at startup, whether loaded or not; promptguard_loaded
            reports whether it serves. The identity is contract-relevant and inferable from
            behaviour; contiguity settings are tuning an attacker would otherwise have to
            guess and are not published here.
          title: Promptguard Model
          type: string
        sanitizer_revision:
          title: Sanitizer Revision
          type: string
        search_providers:
          description: 'The resolved search-provider chain''s names, in traversal order —
            the FORAGE_SEARCH_PROVIDERS entries this start resolved after key-gated skips
            (a ''brave'' entry with no usable key is absent here, not just unusable). Configuration
            echo fixed for the life of the process, not a liveness probe: it says what this
            start resolved, never whether a provider is reachable right now. Added in contract
            1.2.0.'
          items:
            type: string
          title: Search Providers
          type: array
        status:
          enum:
          - healthy
          - degraded
          title: Status
          type: string
      required:
      - status
      - promptguard_loaded
      - promptguard_model
      - cache_connected
      - capabilities
      - sanitizer_revision
      - contract_version
      - cache_backend
      - search_providers
      title: HealthResponse
      type: object
    MetricsResponse:
      additionalProperties: false
      description: 'Response body for ``GET /metrics``.


        Unauthenticated, like every Forage endpoint (``docs/configuration.md``,

        "Deployment posture"). The counters are content-free by construction — no

        URL, query, filename or document text reaches any of them — but they do

        describe traffic volume and failure rates, so they are part of what network

        placement protects.'
      properties:
        cache:
          $ref: '#/components/schemas/CacheMetricsResponse'
        contract_version:
          description: The wire contract this process implements — the same value /health
            and the OpenAPI document's info.version carry.
          title: Contract Version
          type: string
        extraction:
          $ref: '#/components/schemas/ExtractionMetricsResponse'
        model:
          $ref: '#/components/schemas/ModelMetricsResponse'
        retrieve:
          $ref: '#/components/schemas/RetrieveMetricsResponse'
        search:
          $ref: '#/components/schemas/SearchMetricsResponse'
      required:
      - contract_version
      - extraction
      - search
      - retrieve
      - cache
      - model
      title: MetricsResponse
      type: object
    ModelMetricsResponse:
      additionalProperties: false
      description: 'The ``model`` section of ``GET /metrics`` — weight acquisition.


        ``fetch_in_progress`` is what distinguishes "downloading ~270 MiB" from

        "wedged" while ``/health`` reports ``degraded`` for both, and

        ``retries_scheduled`` separates both of those from "waiting out a backoff".

        On a container whose logs drop INFO (``kit_tools/docs/GOTCHAS.md``) this

        section is the only place a fetch in flight is visible.'
      properties:
        fetch_failures:
          description: Acquisition attempts that failed.
          title: Fetch Failures
          type: integer
        fetch_in_progress:
          description: Whether an acquisition is running right now.
          title: Fetch In Progress
          type: boolean
        quarantines:
          description: Weight sets moved out of the loader's scan tree.
          title: Quarantines
          type: integer
        retries_scheduled:
          description: Retries armed after a failed acquisition. Non-zero with fetch_in_progress
            false is the 'waiting to try again' state.
          title: Retries Scheduled
          type: integer
        verify_failures:
          description: Weight sets refused by manifest verification.
          title: Verify Failures
          type: integer
      required:
      - fetch_failures
      - verify_failures
      - quarantines
      - fetch_in_progress
      - retries_scheduled
      title: ModelMetricsResponse
      type: object
    Pipeline422ErrorResponse:
      additionalProperties: false
      description: '``POST /retrieve`` and ``POST /search`` refusal — the 422 shape.


        The same handler as :class:`Extract422ErrorResponse`, minus the

        ``sanitizer_revision`` it adds only on ``/extract`` paths.'
      properties:
        error:
          description: Stable machine-readable refusal code. The fetch and URL-validation
            codes arrive on /retrieve, the searxng_* codes and search_unavailable on /search.
            busy arrives on /retrieve only, at 422, as the admission refusal (reason admission_queue_full);
            the same literal is /extract's 429. extraction_failed arrives on /retrieve only,
            as a fetched PDF the worker could not parse or spool (reason pdf_encrypted, pdf_no_text,
            pdf_extraction_error or pdf_spool_error).
          enum:
          - blocked_domain
          - busy
          - content_too_large
          - extraction_failed
          - fetch_error
          - fetch_timeout
          - invalid_url
          - private_ip
          - searxng_error
          - searxng_unavailable
          - search_unavailable
          title: Error
          type: string
        reason:
          description: 'Human-readable detail. Unlike the /extract reasons this is not content-free:
            a /retrieve refusal echoes the requested URL, and private_ip echoes the resolved
            address. Deployments exposing Forage beyond a private network should treat it
            accordingly.'
          title: Reason
          type: string
        request_id:
          description: Sidecar-generated id for correlating logs with this refusal.
          title: Request Id
          type: string
      required:
      - error
      - reason
      - request_id
      title: Pipeline422ErrorResponse
      type: object
    RateLimit429Response:
      additionalProperties: false
      description: '``POST /extract`` admission refusal — the 429 shape.


        Emitted by :class:`ExtractionAdmissionMiddleware` when the bounded queue is

        full. Four fields: the middleware mints a request id and reads the process

        revision itself, so this body matches the /extract 422 shape even though it

        never passes through the error handler.'
      properties:
        error:
          const: busy
          description: Always 'busy' at this status.
          title: Error
          type: string
        reason:
          description: Fixed, content-free user message for the busy refusal.
          title: Reason
          type: string
        request_id:
          description: Middleware-generated id for correlating logs with this refusal.
          title: Request Id
          type: string
        sanitizer_revision:
          description: The pipeline revision of the process that refused admission. Empty
            string if the request arrived before the lifespan published one.
          title: Sanitizer Revision
          type: string
      required:
      - error
      - reason
      - request_id
      - sanitizer_revision
      title: RateLimit429Response
      type: object
    RetrieveMetricsResponse:
      additionalProperties: false
      description: The ``retrieve`` section of ``GET /metrics``.
      properties:
        blocked_by_reason:
          additionalProperties:
            type: integer
          description: Injection blocks keyed by the leading diagnostic, bucketed into contract.METRICS_OTHER_BUCKET
            outside the closed vocabulary.
          title: Blocked By Reason
          type: object
        busy_rejections:
          description: '`/retrieve` requests refused 422 `busy` (reason `admission_queue_full`)
            because the admission queue was at `retrieve.admission_queue_depth` or its byte
            reservation would have exceeded `retrieve.max_queued_fetch_bytes`.'
          title: Busy Rejections
          type: integer
        cache_hits:
          description: Requests served from the content cache. A *request* outcome — see the
            cache section for the storage-operation counters underneath.
          title: Cache Hits
          type: integer
        cache_misses:
          description: Requests that had to fetch.
          title: Cache Misses
          type: integer
        classification_wait_timeouts:
          description: '`/retrieve` requests that waited `promptguard_wait_seconds` for the
            classification permit and gave up, taking the classifier-unavailable outcome under
            the request''s own `promptguard_fail_closed`. Rising with `promptguard_loaded:
            true` on `/health` means permit contention, not a missing model.'
          title: Classification Wait Timeouts
          type: integer
        errors:
          additionalProperties:
            type: integer
          description: Refusals keyed by the /retrieve error code.
          title: Errors
          type: object
        policy_invalid_domain_entry:
          description: 'Dropped request domain entries, one increment per entry: invalid entries
            in any list or the over-budget remainder of an allowlist. The two allowlist drop
            causes both narrow privilege; an over-budget denylist is refused, never truncated
            or counted. Offending entries are not stored.'
          title: Policy Invalid Domain Entry
          type: integer
        policy_suffix_trusted_skip:
          description: Uncached retrievals resolving to trusted or verified through a leading-dot
            entry. Covers both the trusted classifier skip and the verified exemption when
            classification is unavailable, even if classification is available on this request.
            Exact matches through bare entries do not increment it.
          title: Policy Suffix Trusted Skip
          type: integer
        promptguard_contiguity_detections:
          description: Retrievals blocked by the contiguity rule, including both-rule verdicts.
          title: Promptguard Contiguity Detections
          type: integer
        promptguard_state:
          additionalProperties:
            type: integer
          description: Retrievals by classifier state (scanned / skipped / unavailable), bucketed
            the same way.
          title: Promptguard State
          type: object
        requests:
          description: Retrieve requests that reached the handler.
          title: Requests
          type: integer
        semaphore_saturation:
          description: '`/retrieve` requests that found every fetch slot of the admission
            gate busy (`retrieve.fetch_concurrency`) — not the classification permit, which
            is `classification_wait_timeouts`. Counts queueing as well as refusal, so it is
            always >= busy_rejections.'
          title: Semaphore Saturation
          type: integer
      required:
      - requests
      - errors
      - cache_hits
      - cache_misses
      - blocked_by_reason
      - promptguard_state
      - policy_invalid_domain_entry
      - policy_suffix_trusted_skip
      - classification_wait_timeouts
      - semaphore_saturation
      - busy_rejections
      - promptguard_contiguity_detections
      title: RetrieveMetricsResponse
      type: object
    RetrieveRequest:
      description: 'Inbound request to retrieve and sanitise a URL.


        `/retrieve` fetches and sanitizes one caller-named URL through the full

        pipeline, cached by `sanitizer_revision`; `/search` finds and returns

        provider-extracted content for a query across sources — snippets or

        chunks, per result `content_kind` — from the configured provider chain,

        every result sanitized, never cached. Only `/retrieve` honours

        `cache_ttl_hours`, `extract_mode`, `trusted_domains` and `verified_domains`;

        only `/search` honours `allow_paid_fallback`, `num_results` and `providers`

        and scans every result at trust tier `standard`.

        Shared by both routes: `blocked_domains`, `promptguard_threshold` and

        `promptguard_fail_closed`. On both routes, an omitted or null threshold

        uses the validated `config.yaml` default (shipped as 0.85), then

        `promptguard_threshold_ceiling` bounds the requested or default value.'
      properties:
        blocked_domains:
          description: 'Domains to block outright: blocked_domains always covers subdomains
            for multi-label names, with or without a leading dot; an IP literal matches only
            itself. Single-label entries match exactly. Upgrade note: existing multi-label
            entries now cover subdomains; review apex entries before upgrading, because a
            multi-tenant apex removes every tenant. Single-label entries keep matching exactly
            as before.'
          items:
            type: string
          title: Blocked Domains
          type: array
        cache_ttl_hours:
          default: 24
          description: Maximum age of cached content; zero disables caching
          maximum: 8760.0
          minimum: 0.0
          title: Cache Ttl Hours
          type: integer
        extract_mode:
          default: summary
          description: Extraction mode
          enum:
          - summary
          - full
          title: Extract Mode
          type: string
        promptguard_fail_closed:
          default: true
          description: When True, block content if PromptGuard is unavailable (fail-closed).
            When False, allow with a trust penalty (fail-open). Bounded by the operator's
            floor; trusted_domains skips classification (trusted_tier), and verified_domains
            (VERIFIED) degrades open when unavailable regardless of this flag.
          title: Promptguard Fail Closed
          type: boolean
        promptguard_threshold:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: PromptGuard max-score threshold; the server-side contiguity rule can
            block independently. Null or omitted uses the server's validated config.yaml default
            (shipped as 0.85). The requested or default value is bounded by promptguard_threshold_ceiling.
          title: Promptguard Threshold
        trusted_domains:
          description: 'Domains to treat as trusted: bare entries match exactly; a leading
            dot covers the apex and every subdomain; an IP literal matches only itself. A
            leading-dot trusted_domains entry skips injection classification for every host
            under that suffix. Never name a multi-tenant or registry-level apex (.co.uk, .github.io,
            .s3.amazonaws.com). policy_suffix_trusted_skip counts wildcard-caused resolution
            to either trusted or verified (counter added by US-007).'
          items:
            type: string
          title: Trusted Domains
          type: array
        url:
          description: URL to retrieve
          minLength: 1
          title: Url
          type: string
        verified_domains:
          description: 'Domains to treat as verified: bare entries match exactly; a leading
            dot covers the apex and every subdomain; an IP literal matches only itself. A
            leading-dot verified_domains entry makes every host under that suffix degrade
            open when the classifier is unavailable, including under promptguard_fail_closed_floor
            and a load-triggered classification wait timeout. Never name a multi-tenant or
            registry-level apex (.co.uk, .github.io, .s3.amazonaws.com). policy_suffix_trusted_skip
            counts wildcard-caused resolution to either trusted or verified (counter added
            by US-007).'
          items:
            type: string
          title: Verified Domains
          type: array
      required:
      - url
      title: RetrieveRequest
      type: object
    RetrievedContent:
      description: 'Sanitised web content returned to Poppy core.


        This is the **sole** object that crosses the sidecar boundary.'
      properties:
        body:
          description: Sanitised main content (never raw HTML/PDF bytes)
          title: Body
          type: string
        cache_hit:
          default: false
          description: Whether this result came from cache
          title: Cache Hit
          type: boolean
        cached_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the result was cached (if cache_hit)
          title: Cached At
        content_type:
          description: 'Source format: ''html'' or ''pdf'''
          title: Content Type
          type: string
        domain:
          description: Domain of final_url
          minLength: 1
          title: Domain
          type: string
        domain_changed_on_redirect:
          default: false
          description: Whether the domain changed between source_url and final_url
          title: Domain Changed On Redirect
          type: boolean
        effective_promptguard_fail_closed:
          default: true
          description: 'Policy applied to this request''s promptguard_fail_closed flag, bounded
            by the operator''s floor. Decides behaviour only when the classifier is unavailable
            (absent or classification wait timed out), not whether content was scanned; read
            promptguard_state for that. Neither effective policy field overrides caller-supplied
            trust tiers: a trusted_domains match skips classification (trusted_tier), and
            a verified_domains match (VERIFIED) degrades open when unavailable.'
          title: Effective Promptguard Fail Closed
          type: boolean
        effective_promptguard_threshold:
          default: 0.85
          description: 'Block threshold applied to this request, bounded by the operator''s
            ceiling. Reports policy, not whether content was scanned; read promptguard_state
            for that. Neither effective policy field overrides caller-supplied trust tiers:
            a trusted_domains match skips classification (trusted_tier), and a verified_domains
            match (VERIFIED) degrades open when the classifier is unavailable.'
          maximum: 1.0
          minimum: 0.0
          title: Effective Promptguard Threshold
          type: number
        final_url:
          description: URL after redirects resolved
          minLength: 1
          title: Final Url
          type: string
        injection_detected:
          default: false
          description: Whether prompt-injection was detected
          title: Injection Detected
          type: boolean
        injection_spans:
          description: Detected injection text spans
          items:
            type: string
          title: Injection Spans
          type: array
        promptguard_state:
          default: scanned
          description: 'How PromptGuard examined this content: scanned, skipped_trusted, structural_blocked,
            unavailable_blocked, or unavailable_allowed'
          enum:
          - scanned
          - skipped_trusted
          - structural_blocked
          - unavailable_blocked
          - unavailable_allowed
          title: Promptguard State
          type: string
        redirect_chain:
          description: Ordered list of redirect URLs
          items:
            type: string
          title: Redirect Chain
          type: array
        request_id:
          description: UUID for this retrieval
          minLength: 1
          title: Request Id
          type: string
        retrieved_at:
          description: When the content was fetched (UTC)
          format: date-time
          title: Retrieved At
          type: string
        source_url:
          description: Original URL requested
          minLength: 1
          title: Source Url
          type: string
        stage2_verdict:
          $ref: '#/components/schemas/Stage2Verdict'
          description: Stage-2 structural heuristic verdict
        stage3_verdict:
          $ref: '#/components/schemas/Stage3Verdict'
          description: Stage-3 PromptGuard ML verdict
        structural_flags:
          description: Structural heuristic flags raised
          items:
            type: string
          title: Structural Flags
          type: array
        title:
          anyOf:
          - type: string
          - type: 'null'
          description: Page title
          title: Title
        truncation_notice:
          anyOf:
          - type: string
          - type: 'null'
          description: Describes what was omitted when extract_mode='summary'
          title: Truncation Notice
        trust_score:
          description: Composite trust score (0.0-1.0)
          maximum: 1.0
          minimum: 0.0
          title: Trust Score
          type: number
        trust_tier:
          $ref: '#/components/schemas/TrustTier'
          description: Resolved trust tier
        word_count:
          description: Word count of body
          minimum: 0.0
          title: Word Count
          type: integer
      required:
      - request_id
      - source_url
      - final_url
      - body
      - word_count
      - content_type
      - trust_score
      - trust_tier
      - stage2_verdict
      - stage3_verdict
      - domain
      title: RetrievedContent
      type: object
    SearchMetricsResponse:
      additionalProperties: false
      description: The ``search`` section of ``GET /metrics``.
      properties:
        classification_wait_timeouts:
          description: '`/search` requests whose per-request PromptGuard wait budget expired
            — at most one per request, however many results were left unscanned afterwards.
            The classifier was loaded and busy, not absent: compare against `/health` `promptguard_loaded`
            and the `retrieve` counter of the same name.'
          title: Classification Wait Timeouts
          type: integer
        errors:
          additionalProperties:
            type: integer
          description: Refusals keyed by the /search error code (searxng_error, searxng_unavailable,
            search_unavailable).
          title: Errors
          type: object
        fallback_fired:
          description: Per-process count of the per-response `fallback_fired` bool — how many
            `/search` requests had their provider chain advance past the first provider, including
            ones that ended in a 422. Moves only when the configured chain has more than one
            provider; a `searxng`-only deployment's first-party signal is the `search_provider_failed`
            WARNING instead.
          title: Fallback Fired
          type: integer
        omitted_by_reason:
          additionalProperties:
            type: integer
          description: Results withheld, keyed by the closed omission vocabulary; anything
            outside it is folded into contract.METRICS_OTHER_BUCKET rather than growing this
            map without bound.
          title: Omitted By Reason
          type: object
        paid_calls:
          description: Count of calls made to a `paid=True` provider, incremented before the
            call so a call that times out is still counted — whether or not it went on to
            serve the response. Zero on a chain with no paid provider configured.
          title: Paid Calls
          type: integer
        policy_invalid_domain_entry:
          description: Dropped invalid denylist entries, one increment per entry, never the
            offending value. Request entries are normalised once; an over-budget denylist
            is refused, never truncated or counted.
          title: Policy Invalid Domain Entry
          type: integer
        policy_suffix_trusted_skip:
          description: Reserved for parity with /retrieve; always zero because /search has
            no trusted or verified tiers.
          title: Policy Suffix Trusted Skip
          type: integer
        policy_unknown_provider:
          description: Per-request `providers` entries ignored — beyond the first eight, or
            matching no configured provider — never the offending name itself. Compare against
            `/health` `search_providers` to tell a bad name from a missing key.
          title: Policy Unknown Provider
          type: integer
        promptguard_contiguity_detections:
          description: Results omitted by the contiguity rule, including both-rule verdicts.
          title: Promptguard Contiguity Detections
          type: integer
        promptguard_latency_target_exceeded:
          description: 'Search requests whose duration strictly exceeds search_promptguard_latency_target_ms,
            counted once per request. Measures the per-result sanitization loop: structural
            scan, PromptGuard and any semaphore wait. The loop runs once per served result,
            so the duration scales with num_results (1-20); compare readings only at the same
            num_results.'
          title: Promptguard Latency Target Exceeded
          type: integer
        provider_compressed_body:
          description: 'Non-identity Content-Encoding responses seen from any provider, whatever
            the outcome: served, refused as body_too_large or unsupported_encoding, malformed,
            non-2xx, or failed after headers. A zero count means no compression.'
          title: Provider Compressed Body
          type: integer
        provider_timeouts:
          description: 'Provider calls that ended as timeout: the per-operation httpx timeout
            or the whole-interaction budget. A rise after upgrading on a previously working
            slow SearXNG is the budget tightening; raise search_searxng_timeout_seconds.'
          title: Provider Timeouts
          type: integer
        requests:
          description: Search requests that reached the handler.
          title: Requests
          type: integer
        sanitization_latency_max_ms:
          description: 'Per-process high-water mark in milliseconds, truncated from the rounded
            duration of the per-result sanitization loop: structural scan, PromptGuard and
            any semaphore wait. Updated even below search_promptguard_latency_target_ms, including
            served-empty searches, but not pre-loop refusals. The loop runs once per served
            result, so the duration scales with num_results (1-20); compare readings only
            at the same num_results. Never resets; restarting the container is the only way
            to clear it. Only meaningful read together with search.promptguard_latency_target_exceeded
            and search.requests.'
          title: Sanitization Latency Max Ms
          type: integer
        unscanned_results:
          description: Results returned without an ML injection scan (degraded mode).
          title: Unscanned Results
          type: integer
      required:
      - requests
      - errors
      - omitted_by_reason
      - unscanned_results
      - fallback_fired
      - paid_calls
      - policy_unknown_provider
      - policy_invalid_domain_entry
      - policy_suffix_trusted_skip
      - classification_wait_timeouts
      - provider_compressed_body
      - provider_timeouts
      - promptguard_latency_target_exceeded
      - sanitization_latency_max_ms
      - promptguard_contiguity_detections
      title: SearchMetricsResponse
      type: object
    SearchRequest:
      description: 'Inbound request to run a web search.


        `/search` finds and returns provider-extracted content for a query

        across sources — snippets or chunks, per result `content_kind` — from

        the configured provider chain, every result sanitized, never cached;

        `/retrieve` fetches and sanitizes one caller-named URL through the full

        pipeline, cached by `sanitizer_revision`. Only `/search` honours

        `allow_paid_fallback`, `num_results` and `providers` and scans every result

        at trust tier `standard`; only `/retrieve` honours `cache_ttl_hours`,

        `extract_mode`, `trusted_domains` and `verified_domains`.

        Shared by both routes: `blocked_domains`, `promptguard_threshold` and

        `promptguard_fail_closed`. On both routes, an omitted or null threshold

        uses the validated `config.yaml` default (shipped as 0.85), then

        `promptguard_threshold_ceiling` bounds the requested or default value.'
      properties:
        allow_paid_fallback:
          default: true
          description: 'When False, excludes every paid provider from this request''s effective
            chain regardless of `providers` — free providers always run. Applied after `providers`''
            own normalise-then-ignore-and-count filtering (ruling 29). One-way: can only narrow
            the configured chain, never widen, reorder, or key it. Honoured from contract
            1.2.0.'
          title: Allow Paid Fallback
          type: boolean
        blocked_domains:
          description: Domains to omit from search results as blocked_url, merged after the
            operator's seed_blocklist, which cannot be overridden. Multi-label names cover
            the apex and every dot-boundary subdomain, with or without a leading dot; single-label
            names and IP literals match exactly. Entries are stripped and UTS-46-canonicalised
            once; invalid entries are ignored and counted on search.policy_invalid_domain_entry,
            never echoed. No entry-count cap. A raw list over policy_domain_entries_max_bytes
            (UTF-8 bytes including newline separators) is refused whole with 422 search_unavailable
            / policy_domain_list_too_large before normalisation. Honoured from contract 1.3.0.
          items:
            type: string
          title: Blocked Domains
          type: array
        num_results:
          default: 5
          description: Number of results to return
          maximum: 20.0
          minimum: 1.0
          title: Num Results
          type: integer
        promptguard_fail_closed:
          default: true
          description: When True, drop search results if PromptGuard is unavailable (fail-closed).
            When False, allow with a suspicion marker (fail-open). Bounded by the operator's
            floor.
          title: Promptguard Fail Closed
          type: boolean
        promptguard_threshold:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: PromptGuard max-score threshold; the server-side contiguity rule can
            block independently. Null or omitted uses the server's validated config.yaml default
            (shipped as 0.85). The requested or default value is bounded by promptguard_threshold_ceiling.
          title: Promptguard Threshold
        providers:
          description: 'Restrict-only filter of the configured provider chain, in configured
            order: can exclude paid providers only, never add, reorder, or key one — free
            providers always run. A non-empty list keeps only the longest prefix of the configured
            paid sequence whose every member is named; a named paid provider after an unnamed
            paid provider is dropped, never promoted. provider_used never names a dropped
            provider; if you named a paid provider and provider_used is not it, check its
            position in FORAGE_SEARCH_PROVIDERS. On an all-paid configured chain, a later-paid-only
            selection leaves no provider and returns 422 search_unavailable with reason policy_excluded_all_providers.
            Entries are matched after strip() and lower-casing against the names /health''s
            `search_providers` publishes. Entries beyond the first eight, and entries matching
            no configured provider, are ignored and counted on /metrics `search.policy_unknown_provider`
            rather than rejected. Empty (the default) means the configured chain runs unrestricted.
            Honoured from contract 1.2.0.'
          items:
            type: string
          title: Providers
          type: array
        query:
          description: Search query
          minLength: 1
          title: Query
          type: string
      required:
      - query
      title: SearchRequest
      type: object
    SearchResponse:
      description: Response wrapper for search results.
      properties:
        effective_promptguard_fail_closed:
          default: true
          description: 'Policy applied to this request''s promptguard_fail_closed flag, bounded
            by the operator''s floor. Decides behaviour only when the classifier is unavailable
            (absent or classification wait timed out), not whether results were scanned; read
            omissions, suspicious, promptguard_unavailable and unscanned_results for that.
            This route uses STANDARD tier; the floor does not override caller-supplied trust
            tiers on /retrieve: trusted_domains skips classification (trusted_tier), and verified_domains
            (VERIFIED) degrades open when unavailable.'
          title: Effective Promptguard Fail Closed
          type: boolean
        effective_promptguard_threshold:
          default: 0.85
          description: Policy applied to this request's PromptGuard threshold after resolving
            the configured default and operator ceiling, not whether results were scanned;
            read omissions, suspicious, promptguard_unavailable and unscanned_results for
            that. This route uses STANDARD tier; /retrieve retains its trusted_tier skip and
            VERIFIED unavailable exemption.
          maximum: 1.0
          minimum: 0.0
          title: Effective Promptguard Threshold
          type: number
        fallback_fired:
          default: false
          description: 'True iff the provider chain advanced past the first provider before
            this response was served — the per-response face of the `search.fallback_fired`
            /metrics counter. It records chain advancement, not which provider ultimately
            served: for a chain that tries a provider before a free one, this is True when
            the free provider ends up serving.'
          title: Fallback Fired
          type: boolean
        omitted_by_reason:
          additionalProperties:
            type: integer
          description: 'Withheld-result counts keyed by contract.OMIT_* reason. Five keys
            are defined — ''invalid_url'', ''structural_blocked'', ''injection_detected''
            and ''promptguard_unavailable'' in contract 1.1.0, and ''blocked_url'' added in
            contract 1.3.0. ''invalid_url'' is a URL that is missing, over-length, or could
            not be parsed or canonicalised at all; ''blocked_url'' is a URL that parsed cleanly
            but names a literal private, loopback, link-local, documentation-range or blocklisted
            host — policy, not malformation. Only non-zero reasons appear. Deliberately a
            dict rather than an enum: a consumer sums the values and buckets keys it does
            not know (as /metrics does, under ''other''), so a future omission reason is an
            additive-safe MINOR change instead of a validation failure on an old client.'
          title: Omitted By Reason
          type: object
        omitted_results:
          default: 0
          description: Examined candidate results the pipeline withheld, across all reasons
          minimum: 0.0
          title: Omitted Results
          type: integer
        promptguard_unavailable:
          default: false
          description: PromptGuard was needed but did not run on at least one examined result
            (withheld or returned) — a stage-2 structural block never needed a scan and does
            not count
          title: Promptguard Unavailable
          type: boolean
        provider_errors:
          description: 'Chain-order ''<provider_name>: <failure_class>'' entries for every
            provider tried before the one that served, from a closed failure-class vocabulary
            — never exception text or a URL. The only home for provider-level failures: they
            never affect omitted_results/omitted_by_reason or unresponsive_engines.'
          items:
            type: string
          title: Provider Errors
          type: array
        provider_used:
          description: 'The serving provider''s name (the token FORAGE_SEARCH_PROVIDERS names,
            e.g. ''searxng'', ''brave''). An open string rather than an enum: a third provider
            is an additive change, not a validation failure on an old client.'
          minLength: 1
          title: Provider Used
          type: string
        query:
          description: Original query
          minLength: 1
          title: Query
          type: string
        request_id:
          description: UUID for this search
          minLength: 1
          title: Request Id
          type: string
        results:
          description: Search results
          items:
            $ref: '#/components/schemas/SearchResult'
          title: Results
          type: array
        unresponsive_engines:
          description: SearXNG engines that failed to respond
          items:
            type: string
          title: Unresponsive Engines
          type: array
        unscanned_results:
          default: 0
          description: Returned results PromptGuard did not scan
          minimum: 0.0
          title: Unscanned Results
          type: integer
      required:
      - request_id
      - query
      - provider_used
      title: SearchResponse
      type: object
    SearchResult:
      description: A single search result.
      properties:
        content_kind:
          default: snippet
          description: 'What kind of content this result carries: ''snippet'' for a search
            engine''s own summary (every SearXNG result), ''chunk'' for a passage a provider
            extracted from the page. Those two values are the whole set. Added in contract
            1.2.0.'
          enum:
          - snippet
          - chunk
          title: Content Kind
          type: string
        date:
          anyOf:
          - type: string
          - type: 'null'
          description: The result's publication date as a strict 'YYYY-MM-DD' calendar date.
            Anything else — absent, a non-string, a different format, or a day that does not
            exist — is null. Added in contract 1.2.0.
          title: Date
        domain:
          description: The canonicalised ASCII host of `url`, with no userinfo or port — a
            provenance signal, not a trust decision. A name is UTS-46-encoded, so an internationalised
            host appears here in punycode ('xn--strae-oqa.de') while `url` keeps the provider's
            spelling ('http://straße.de/'); an address literal is the raw lower-cased literal
            as it was written. This is the host, not the registrable domain (eTLD+1); derive
            that yourself if you need it. For an IPv6 literal this is the unbracketed form
            ('2606:4700::1111') while `url` carries the bracketed form ('[2606:4700::1111]')
            — the one case where `domain` is not a substring of `url`. Added in contract 1.2.0.
          minLength: 1
          title: Domain
          type: string
        engine:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          description: 'Search engine used, NFC-normalized with C0/C1 controls deleted and
            whitespace runs collapsed, truncated to 64 characters. A non-string or an empty-after-normalisation
            value is null. Bound and normalisation added in contract 1.3.0 — provider-controlled
            provenance metadata, not page content: neither structurally scanned nor part of
            the PromptGuard input.'
          title: Engine
        snippet:
          description: Result snippet / description
          title: Snippet
          type: string
        suspicious:
          default: false
          description: 'Whether Stage 2 or Stage 3 flagged this result as suspicious — and
            also set for every result PromptGuard did not scan at all, either because the
            classifier was absent or because the request''s classification wait expired while
            it was busy. `promptguard_unavailable` says whether any result in this response
            was unscanned and `unscanned_results` says how many, so the consumer rule is:
            on `promptguard_unavailable: true`, treat every `suspicious` result as unscanned
            rather than as scanned-and-flagged. Since contract 1.3.0 a single response may
            mix the two — the wait budget is per request, so earlier results can be scanned
            and later ones not.'
          title: Suspicious
          type: boolean
        title:
          description: Result title
          title: Title
          type: string
        url:
          description: Result URL
          title: Url
          type: string
      required:
      - title
      - url
      - domain
      - snippet
      title: SearchResult
      type: object
    Stage2Verdict:
      description: Stage-2 (structural heuristic) injection verdict.
      enum:
      - clean
      - suspicious
      - blocked
      title: Stage2Verdict
      type: string
    Stage3Verdict:
      description: Stage-3 (PromptGuard ML) injection verdict.
      enum:
      - safe
      - injection_detected
      title: Stage3Verdict
      type: string
    TrustTier:
      description: Domain trust classification.
      enum:
      - trusted
      - verified
      - standard
      - untrusted
      - blocked
      title: TrustTier
      type: string
    UploadProvenance:
      description: 'Display-only metadata for an untrusted uploaded document.


        Downstream consumers must treat ``filename`` and ``mime_hint`` as display

        text only. They must never use either value as a filesystem path.'
      properties:
        filename:
          description: Sanitized display filename
          minLength: 1
          title: Filename
          type: string
        mime_hint:
          anyOf:
          - type: string
          - type: 'null'
          description: Caller hint only; never authoritative for type detection
          title: Mime Hint
        source_type:
          const: upload
          default: upload
          title: Source Type
          type: string
      required:
      - filename
      title: UploadProvenance
      type: object
    ValidationErrorDetail:
      description: 'One entry of the service''s redacted request-validation error list.


        The handler emits the declared trio ``loc``, ``msg``, ``type``, capped at

        ``_MAX_VALIDATION_ERRORS`` entries. For contract 1.3.0 ``input``, ``ctx``

        and ``url`` are present with the fixed value ``"[redacted]"``; they are

        dropped at the next MINOR (GOVERNANCE ruling (l)).'
      properties:
        loc:
          description: Path to the offending field within the request.
          items:
            anyOf:
            - type: string
            - type: integer
          title: Loc
          type: array
        msg:
          description: Human-readable validation message.
          title: Msg
          type: string
        type:
          description: Pydantic error type, e.g. 'missing'.
          title: Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationErrorDetail
      type: object
info:
  description: 'Forage fetches, sanitizes and caches web content for an AI agent: it reports
    what it found and how confident it is, and its consumer owns every trust decision.


    **Forage ships no authentication.** Every endpoint below — and `/docs`, `/redoc` and `/openapi.json`
    with them — is unauthenticated by design. There is no API key, no bearer token, no allowlist
    and no rate limit, so **network placement is the access control**: run Forage only on
    a private network and never publish its port to an untrusted segment. Anyone who can reach
    it can make it fetch arbitrary URLs on your behalf and can read every counter `/metrics`
    exposes.


    Forage is not a trust boundary. A `healthy` Forage is not a promise that the content it
    returned is safe. See `docs/configuration.md`, "Deployment posture".'
  title: Forage
  version: 1.3.0
openapi: 3.1.0
paths:
  /extract:
    post:
      description: 'Extract an internal-network upload with fixed untrusted fail-closed policy.


        This endpoint is unauthenticated — like every other Forage route — so

        network placement is its only access control: keep the service on a

        private network and never publish port 8020 to an untrusted one (see

        ``docs/configuration.md``, "Deployment posture"). Filename and MIME hint

        are display-only metadata; downstream consumers must never use them as

        filesystem paths.


        Document failures use these stable ``error`` tokens: ``content_too_large``,

        ``content_too_large_to_classify``, ``pdf_encrypted``, ``pdf_no_text``,

        ``unsupported_format``, ``extraction_failed``, and ``busy``. ``reason`` is

        always a fixed, content-free user message.'
      operationId: extract_extract_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extract_extract_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedContent'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: 'The request body could not be parsed as multipart form data. FastAPI''s
            own body-parsing guard produces this, with the fixed detail ''There was an error
            parsing the body'' — and it is also what an over-sized upload actually receives
            today: the guard catches the streaming size refusal below before it can become
            a 413. Measured on the pinned FastAPI; see kit_tools/docs/GOTCHAS.md.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: The extract route is disabled for this deployment (extract_route_enabled
            is false).
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admission413Response'
          description: 'The request body crossed the byte limit while streaming; refused before
            multipart parsing, so no request_id exists. Documented because DocumentSizeLimitMiddleware
            emits exactly this shape, but currently shadowed on this route: see the 400 above.'
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Extract422ErrorResponse'
                - $ref: '#/components/schemas/HTTPValidationError'
                title: Response 422 Extract Extract Post
          description: Document failure (coded body, carrying sanitizer_revision) or request
            validation failure (redacted loc/msg/type entries, at most _MAX_VALIDATION_ERRORS
            (100); input/ctx/url carry '[redacted]' in contract 1.3.0 and are dropped at the
            next MINOR).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimit429Response'
          description: Extraction is at capacity and the admission queue is full.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: The extraction admission controller is not wired up — a process that
            is starting, or one served by a transport that never ran the lifespan.
      summary: Extract
  /health:
    get:
      description: 'Return service health status.


        Always responds 200, even when degraded. The compose healthcheck''s

        ``curl -fsS -o /dev/null`` inspects only the HTTP status and discards the

        body: liveness, not health. Plain Compose reports unhealthy probes but

        does not restart on them. Callers must check ``status``/``degraded_reasons``

        in the body; Docker-healthy does not imply that the classifier is loaded.'
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Health
  /metrics:
    get:
      description: 'Expose internal extraction, search, retrieve, cache, and model counters.


        The handler still builds the body as a dict and lets

        :class:`MetricsResponse` validate it on the way out — that ordering is the

        point. A counter added here and not to the model fails response validation

        loudly rather than being filtered out of the wire in silence.'
      operationId: metrics_metrics_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
          description: Successful Response
      summary: Metrics
  /retrieve:
    post:
      description: 'Fetch and sanitize one caller-named URL through the full pipeline.


        `/retrieve` fetches and sanitizes one caller-named URL through the full

        pipeline, cached by `sanitizer_revision`; `/search` finds and returns

        provider-extracted content for a query across sources — snippets or

        chunks, per result `content_kind` — from the configured provider chain,

        every result sanitized, never cached.


        Only `/retrieve` honours `cache_ttl_hours`, `extract_mode`, `trusted_domains`

        and `verified_domains`; only `/search` honours `allow_paid_fallback`,

        `num_results` and `providers` and scans every result at trust tier `standard`.

        Shared by both routes: `blocked_domains`, `promptguard_threshold` and

        `promptguard_fail_closed`. On both routes, an omitted or null threshold

        uses the validated `config.yaml` default (shipped as 0.85), then

        `promptguard_threshold_ceiling` bounds the requested or default value.'
      operationId: retrieve_retrieve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievedContent'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Pipeline422ErrorResponse'
                - $ref: '#/components/schemas/HTTPValidationError'
                title: Response 422 Retrieve Retrieve Post
          description: Pipeline refusal (coded body) or request validation failure (redacted
            loc/msg/type entries, at most _MAX_VALIDATION_ERRORS (100); input/ctx/url carry
            '[redacted]' in contract 1.3.0 and are dropped at the next MINOR).
      summary: Retrieve
  /search:
    post:
      description: 'Find and return provider-extracted content for a query, across sources.


        `/search` finds and returns provider-extracted content for a query

        across sources — snippets or chunks, per result `content_kind` — from

        the configured provider chain, every result sanitized, never cached;

        `/retrieve` fetches and sanitizes one caller-named URL through the full

        pipeline, cached by `sanitizer_revision`.


        Only `/search` honours `allow_paid_fallback`, `num_results` and `providers`

        and scans every result at trust tier `standard`; only `/retrieve` honours

        `cache_ttl_hours`, `extract_mode`, `trusted_domains` and `verified_domains`.

        Shared by both routes: `blocked_domains`, `promptguard_threshold` and

        `promptguard_fail_closed`. On both routes, an omitted or null threshold

        uses the validated `config.yaml` default (shipped as 0.85), then

        `promptguard_threshold_ceiling` bounds the requested or default value.'
      operationId: search_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Pipeline422ErrorResponse'
                - $ref: '#/components/schemas/HTTPValidationError'
                title: Response 422 Search Search Post
          description: Pipeline refusal (coded body) or request validation failure (redacted
            loc/msg/type entries, at most _MAX_VALIDATION_ERRORS (100); input/ctx/url carry
            '[redacted]' in contract 1.3.0 and are dropped at the next MINOR).
      summary: Search
