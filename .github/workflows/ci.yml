# Forage CI — one workflow file for the whole gate chain.
#
# Everything lives here on purpose: `needs:` cannot span workflow files, so a
# split would turn the publish gates into wishful thinking. Jobs are therefore
# introduced in dependency order across the `forage-ci-and-image` stories, and
# a `needs:` may never name a job a later story adds — GitHub rejects the whole
# file, not just the offending job. `lint` (US-001), `typecheck` (US-006),
# `test` (US-002), `build-amd64` and `secret-grep` (US-003), `smoke` (US-005)
# and `publish` (US-007) are all here; `searxng-build` / `searxng-publish`
# arrive in US-004.
#
# `lint`, `typecheck`, `test` and `build-amd64` are siblings, not a chain: none
# reads another's output, so making one `needs:` another would only serialise
# short jobs and delay the second and third failure reports. The `needs:` edges
# that matter are `secret-grep`'s (below) and `publish`'s, which hangs off all
# six, because a publish must not happen over a red gate.
#
# `build-amd64` is deliberately *not* gated on `lint`/`typecheck`/`test`: a
# broken image and a broken lint are independent failures and a developer wants
# both reports from one run. US-007's `publish` is what requires every gate to
# be green at once.
#
# The image travels between jobs as an artifact, never as a rebuild. `needs:`
# is an ordering edge, not a shared Docker daemon — each job gets a fresh runner
# with an empty image store — so `build-amd64` ends with `docker save` +
# `upload-artifact`, and every consumer downloads it, `docker load`s it, and
# asserts the loaded image ID equals the one `build-amd64` recorded. Two builds
# of "the same" Dockerfile are not the same image; one artifact with an asserted
# identity is.
#
# Supply-chain posture (this repo goes public in US-008):
#   * every third-party action is pinned to a full 40-hex commit SHA with a
#     `# vX.Y.Z` comment saying what that SHA is;
#   * the workflow token is read-only at the top level — a publish job raises
#     its own job-scoped permissions and nothing else inherits them;
#   * checkout never persists credentials into the runner's git config;
#   * `pull_request_target` is banned outright. Fork PRs run these gates as
#     ordinary `pull_request` events: GitHub-hosted runner, read-only
#     GITHUB_TOKEN, no repository secrets. That is the correct posture here —
#     Poppy's same-repo fork guard is a *self-hosted-runner* mitigation, and
#     copying it onto hosted runners would either skip every gate on external
#     contributions or kill fork CI outright.
#
# actionlint (below) machine-checks that this file is *valid*; nothing in
# actionlint checks that it is *safe*, so tests/test_ci_workflow.py asserts the
# properties above on every run of the suite.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags:
      # Two patterns, both load-bearing: `v*` is the service image's release
      # lane and does NOT match `searxng-v*`, so without the second pattern the
      # companion image (US-004) has no reachable publish path.
      - "v*"
      - "searxng-v*"

permissions:
  contents: read

concurrency:
  # Superseded PR pushes collapse to the newest commit; main and tag runs are
  # never cancelled — a tag run is the gate chain for a publish.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned + checksum-verified: `actionlint` gates workflow validity on every
  # PR, which only means something if the binary itself is not a moving target.
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  UV_VERSION: "0.9.28"
  # The local-only tag the built image carries between jobs, and the artifact
  # that carries it. Nothing here is a registry reference: `build-amd64` never
  # logs in and never pushes — publishing is US-007's job, under its own
  # job-scoped `packages: write`.
  IMAGE_REF: "forage:ci"
  IMAGE_ARTIFACT: "forage-amd64-image"
  IMAGE_TARBALL: "forage-amd64.tar.gz"
  IMAGE_ID_FILE: "image-id.txt"
  # `smoke` checks the repository out as well as downloading the image, so it
  # unpacks the artifact into a subdirectory instead of over the working tree.
  # `secret-grep` has no checkout and downloads into the job's empty cwd.
  IMAGE_DOWNLOAD_DIR: "downloaded-image"
  # The smoke container's name, and the health budget handed to
  # `contract_smoke.py`. 120 s, not 30: a cold start imports torch before
  # uvicorn binds, and the weights-free PromptGuard load reaches Hugging Face
  # and is refused first (round-2 finding). A guard test ties this number to
  # the script's own default so the two cannot drift.
  SMOKE_CONTAINER: "forage-smoke"
  SMOKE_TIMEOUT_SECONDS: "120"
  # The published service image. Lower-case and spelled out rather than derived
  # from `github.repository_owner`, which renders `WashingBearLabs` — GHCR
  # rejects an upper-case path component, and a publish job is the wrong place
  # to discover that.
  IMAGE_NAME: "ghcr.io/washingbearlabs/forage"
  # The platform list `publish` builds. Single-sourced here because
  # docs/releases.md documents it and a guard test reads it: the arm64 leg is
  # emulated (qemu) and is the one that can be trimmed if it ever stops fitting
  # the budget, and a trim has to be visible in one place.
  PUBLISH_PLATFORMS: "linux/amd64,linux/arm64"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dev environment
        # --locked fails if uv.lock is stale relative to pyproject.toml, so a
        # dependency edit that skipped re-locking cannot reach main.
        run: uv sync --extra dev --locked

      - name: Assert the committed lock is CPU-only
        # Resolving torch from plain PyPI drags in 15 nvidia-* CUDA packages
        # (~2.7 GB) no Forage lane needs. The committed lock is the artifact
        # that has to stay clean; the installed-environment check below proves
        # the lock is actually what CI installs.
        run: |
          set -euo pipefail
          if grep -q 'nvidia-' uv.lock; then
            echo "::error file=uv.lock::uv.lock contains nvidia-* CUDA wheels — re-lock with the pytorch-cpu index configured in pyproject.toml"
            grep -n 'nvidia-' uv.lock | head -20
            exit 1
          fi
          echo "uv.lock is CPU-only: no nvidia-* wheels."

      - name: Assert the synced environment pulled no CUDA wheels
        # The cold-cache evidence for US-001's AC: on a cache miss the step
        # above it downloads every wheel, and this one proves none of them were
        # CUDA. Keep it after the sync, never before.
        run: |
          set -euo pipefail
          uv pip list > installed-packages.txt
          if grep -qiE '^nvidia-' installed-packages.txt; then
            echo "::error::CUDA wheels were installed despite a CPU-only lock"
            grep -iE '^nvidia-' installed-packages.txt
            exit 1
          fi
          echo "No nvidia-* packages in the synced environment."
          grep -iE '^torch ' installed-packages.txt || true
          rm -f installed-packages.txt

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: Install actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          rm -f "${tarball}"
          ./actionlint --version

      - name: actionlint
        run: ./actionlint -color

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dev environment
        # Same `--locked` sync as lint: pyright's answers depend on the exact
        # dependency versions it sees, so the types checked in CI have to come
        # from the committed lock, not from a fresh resolution.
        run: uv sync --extra dev --locked

      - name: pyright (strict)
        # Zero errors, zero baseline. The only rule-level relaxation in the
        # whole repo is `reportPrivateUsage` for tests/, declared in
        # pyproject.toml's [tool.pyright] block and asserted by
        # tests/test_pyright_policy.py — which the `test` job below now runs on
        # every PR, so the policy is enforced by CI and not only at review.
        run: uv run pyright

  test:
    name: test
    runs-on: ubuntu-latest
    # The suite is hermetic and CPU-only: ~3 s locally, and on a cold cache the
    # job is dominated by the ~185 MB torch wheel, not by pytest. The cap is a
    # runaway backstop, not a budget.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dev environment
        # Same `--locked` sync as the other two lanes: the suite must run
        # against the dependency versions the lock pins, or a green run says
        # nothing about what a consumer installs.
        run: uv sync --extra dev --locked

      - name: Verify sanitizer revision derivation
        # Mirrors Poppy's ci.yml step of the same name. Redundant with the full
        # run below and deliberately so: it is a *named* step, so the
        # file-recall cache contract — every security-stage source and
        # behaviour-affecting threshold must mechanically move the sidecar's
        # opaque sanitization revision — reports as its own red line rather
        # than as six failures inside a 607-test log. It runs first, and in
        # seconds, so an unrelated suite failure cannot mask it.
        run: uv run pytest -q tests/test_sanitizer_revision.py

      - name: pytest
        # The whole suite, no selection filters. This is the job that finally
        # makes every guard in this repo CI-enforced: until it existed,
        # test_ci_workflow.py, test_pyright_policy.py, test_dependency_lock.py
        # and the hermeticity canary all bit only on a developer's machine.
        run: uv run pytest -q

  build-amd64:
    name: build-amd64
    runs-on: ubuntu-latest
    # The cold build downloads ~200 MB of CPU torch plus the rest of the lock;
    # the cap is a runaway backstop, not a budget.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the amd64 service image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          # Never push from this job. Publishing is US-007's, behind the full
          # gate chain and its own job-scoped permissions; this job exists to
          # produce one artifact that `secret-grep` and (US-005) `smoke` can
          # inspect. `load: true` puts it in this runner's daemon so it can be
          # saved.
          push: false
          load: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The docker exporter `load: true` uses cannot carry attestations.
          # Leaving provenance on makes buildx build something it then cannot
          # hand to the daemon; turning it off keeps the exported image exactly
          # what gets saved, loaded and asserted downstream.
          provenance: false

      - name: Record the built image ID
        # This is half of the handoff contract. `docker save`/`docker load`
        # preserve an image's ID exactly — it is the digest of the image config
        # — so recording it here and asserting it after every load is what makes
        # "the image the downstream job inspected is the image this job built" a
        # checked fact rather than an assumption about tags.
        #
        # The recorded value is the *daemon's* `.Id`, because that is what a
        # `docker load` on another runner reproduces, so it is the only value
        # the downstream equality check can be made of. A missing image here is
        # a hard failure: there would be nothing to hand on.
        #
        # build-push-action's own `imageid` output is logged beside it as a
        # cross-check, but a disagreement is reported and not failed on. The two
        # legitimately differ depending on how the daemon stores images: the
        # action reports the image *config* digest, while a daemon using the
        # containerd image store reports the manifest-list digest for the same
        # image. Failing on that would be failing on a storage detail. The check
        # that has to be exact is the daemon-to-daemon one below, in
        # `secret-grep` — same field, same command, both sides.
        env:
          BUILDER_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          inspected="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [ -z "${inspected}" ]; then
            echo "::error::the daemon holds no image tagged ${IMAGE_REF}"
            exit 1
          fi
          if [ -z "${BUILDER_IMAGE_ID}" ]; then
            echo "::notice::build-push-action reported no image ID."
          elif [ "${BUILDER_IMAGE_ID#sha256:}" != "${inspected#sha256:}" ]; then
            echo "::notice::builder reported ${BUILDER_IMAGE_ID}, daemon reports ${inspected} (config vs index digest — expected on a containerd image store)"
          else
            echo "Builder and daemon agree on the image ID."
          fi
          printf '%s\n' "${inspected}" > "${IMAGE_ID_FILE}"
          echo "Built ${IMAGE_REF} = ${inspected}"

      - name: Save the image for the downstream jobs
        # gzip -1: the layers inside a `docker save` tar are uncompressed, so a
        # cheap pass is worth a lot of upload time. upload-artifact's own zip
        # step is then disabled (compression-level: 0) rather than run over
        # already-compressed bytes.
        run: |
          set -euo pipefail
          docker save "${IMAGE_REF}" | gzip -1 > "${IMAGE_TARBALL}"
          ls -lh "${IMAGE_TARBALL}" "${IMAGE_ID_FILE}"

      - name: Upload the image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: |
            ${{ env.IMAGE_TARBALL }}
            ${{ env.IMAGE_ID_FILE }}
          # One day: this artifact is consumed minutes later by jobs in the same
          # run and is worth several hundred MB against a 500 MB free-tier
          # storage quota. Nothing should ever read it after the run ends.
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  secret-grep:
    name: secret-grep
    # The first real `needs:` edge in this workflow — and an ordering edge only.
    # The image itself arrives through the artifact below, with its identity
    # asserted; a downstream job cannot see the upstream job's Docker daemon.
    needs: build-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No checkout. This job needs the built image and nothing from the
      # repository: the pattern set below is defined here, in the workflow, so
      # the gate cannot be weakened by editing a script the job fetches.
      - name: Download the image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.IMAGE_ARTIFACT }}

      - name: Load the image and assert it is the one build-amd64 built
        run: |
          set -euo pipefail
          recorded="$(tr -d '[:space:]' < "${IMAGE_ID_FILE}")"
          if [ -z "${recorded}" ]; then
            echo "::error::${IMAGE_ID_FILE} carried no image ID"
            exit 1
          fi
          gunzip -c "${IMAGE_TARBALL}" | docker load
          loaded="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [ "${loaded#sha256:}" != "${recorded#sha256:}" ]; then
            echo "::error::loaded image ${loaded} is not the ${recorded} build-amd64 recorded — this job would be inspecting a different image than the one that was built"
            exit 1
          fi
          echo "Loaded ${IMAGE_REF} = ${loaded} (identical to build-amd64's)"

      - name: Grep the layer history for baked secrets
        # SCOPE — read this before reading a green tick here as "no secrets in
        # the image".
        #
        # `docker history --no-trunc` prints layer *metadata*: the instruction
        # that created each layer, its size, its timestamp. It does not read
        # file contents. What it therefore catches is exactly the leak shape
        # that kept this repository private — a token passed as `--build-arg`,
        # which Docker records verbatim in the layer history of every image
        # built with it, recoverable from any registry the image reaches and
        # unaffected by deleting the file afterwards. It equally catches a
        # secret baked into an `ENV` or typed into a `RUN` command line.
        #
        # It does NOT catch a secret written into a file inside a layer, and it
        # is not a filesystem scanner. Those are covered elsewhere, on purpose:
        # the build-arg path is deleted from the Dockerfile outright and
        # `tests/test_dockerfile.py` fails if it returns; the image bakes no
        # weights and reads no secret store; and the full-history `gitleaks`
        # scan re-runs at HEAD before the public flip (US-008). This job is the
        # mechanical gate that proves the deletion held for the image actually
        # built, on every run.
        #
        # The pattern set is deliberately short and lives here rather than in a
        # checked-out script. `HF_TOKEN` is the variable name the deleted path
        # used; `hf_[A-Za-z0-9]{20,}` is the shape of a Hugging Face token
        # itself, so a differently-named carrier is caught too.
        run: |
          set -euo pipefail
          layer_history="$(docker history --no-trunc "${IMAGE_REF}")"
          echo "--- docker history --no-trunc ${IMAGE_REF} ---"
          printf '%s\n' "${layer_history}"
          echo "--- end history ---"
          status=0
          while IFS= read -r pattern; do
            [ -n "${pattern}" ] || continue
            if printf '%s\n' "${layer_history}" | grep -Eiq -- "${pattern}"; then
              echo "::error::layer history matches forbidden pattern /${pattern}/"
              printf '%s\n' "${layer_history}" | grep -Ein -- "${pattern}" || true
              status=1
            fi
          done <<'PATTERNS'
          HF_TOKEN
          hf_[A-Za-z0-9]{20,}
          PATTERNS
          if [ "${status}" -eq 0 ]; then
            echo "No forbidden pattern in the layer history of ${IMAGE_REF}."
          fi
          exit "${status}"

  smoke:
    name: smoke
    # Ordering only, exactly as in `secret-grep`: the image itself arrives
    # through the artifact below with its identity asserted, because a
    # downstream job cannot see the upstream job's Docker daemon.
    needs: build-amd64
    runs-on: ubuntu-latest
    # The 120 s health budget, plus `docker load` (~28 s) and a cold `uv sync`.
    # A backstop, not a budget.
    timeout-minutes: 20
    steps:
      # This job DOES check the repository out, unlike `secret-grep` — and for
      # the opposite reason. `secret-grep` keeps its working directory empty so
      # its pattern set cannot be weakened by editing a script it fetches. This
      # job's entire point is to compare the running image against *this
      # commit's* contract: `contract_smoke.py` imports `CONTRACT_VERSION` from
      # `pipeline/contract.py`, the degraded reason from the same module, and
      # the `HealthResponse` model that `tests/test_contract_schema.py` pins
      # against the golden fixture. Reading those at job time is what makes a
      # version bump that the image did not pick up a red smoke instead of a
      # green one.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dev environment
        # Same `--locked` sync as every other lane: the smoke's expectations
        # are Python objects imported from this tree, so they have to be
        # resolved against the versions the lock pins.
        run: uv sync --extra dev --locked

      - name: Download the image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ env.IMAGE_DOWNLOAD_DIR }}

      - name: Load the image and assert it is the one build-amd64 built
        # US-003's assertion, unchanged bar the download directory. `needs:`
        # gives ordering; this is what gives identity. `docker save`/`docker
        # load` preserve the image ID exactly — it is the digest of the image
        # config — so a mismatch means this job would be smoking a different
        # image than the one that was built and cleared. What `publish` does
        # with that identity is a separate mechanism: it cannot push this
        # tarball (a multi-arch push is built by buildx across platforms and
        # cannot ship a `docker load`ed image), so it rebuilds the amd64 leg
        # from the same cache and then compares the published layers back
        # against this one. See its verification step.
        run: |
          set -euo pipefail
          recorded="$(tr -d '[:space:]' < "${IMAGE_DOWNLOAD_DIR}/${IMAGE_ID_FILE}")"
          if [ -z "${recorded}" ]; then
            echo "::error::${IMAGE_ID_FILE} carried no image ID"
            exit 1
          fi
          gunzip -c "${IMAGE_DOWNLOAD_DIR}/${IMAGE_TARBALL}" | docker load
          loaded="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [ "${loaded#sha256:}" != "${recorded#sha256:}" ]; then
            echo "::error::loaded image ${loaded} is not the ${recorded} build-amd64 recorded — this job would be smoking a different image than the one that was built"
            exit 1
          fi
          echo "Loaded ${IMAGE_REF} = ${loaded} (identical to build-amd64's)"

      - name: Run the candidate image with no Hugging Face token
        # No `-e` of any kind, deliberately. This is the state every image
        # built from this repository is in until the runtime weights fetch
        # lands (`feature-forage-model-bootstrap`): no token, no weights, and
        # therefore no PromptGuard. The contract asserted below is what an
        # honestly-degraded service owes its consumer in that state. A token
        # passed here would test a configuration this repository cannot build.
        run: |
          set -euo pipefail
          docker run -d --name "${SMOKE_CONTAINER}" -p 8020:8020 "${IMAGE_REF}"
          docker ps --filter "name=${SMOKE_CONTAINER}" --format '{{.Names}} {{.Status}}'

      - name: Assert the degraded /health contract
        # The field expectations are NOT enumerated here. `contract_smoke.py`
        # validates the live body against the same `HealthResponse` model the
        # golden-schema test pins, and reads every wire value it compares from
        # `pipeline/contract.py` at run time — one source of truth, checked by
        # tests/test_contract_smoke.py rather than asserted in a comment. A
        # hand-written field list in bash here would be a second contract.
        run: |
          set -euo pipefail
          uv run python contract_smoke.py \
            --base-url "http://127.0.0.1:8020" \
            --timeout-seconds "${SMOKE_TIMEOUT_SECONDS}"

      - name: Dump the container log
        # Runs on any failure above — a contract violation, a container that
        # never came up, even a bad `docker load`. Without it, "the smoke went
        # red" arrives with no way to tell a crashed import from a wrong field,
        # and the container is gone by the time anyone looks.
        if: failure()
        run: |
          echo "--- docker ps -a ---"
          docker ps -a --filter "name=${SMOKE_CONTAINER}" || true
          echo "--- container state ---"
          docker inspect --format '{{json .State}}' "${SMOKE_CONTAINER}" || true
          echo "--- docker logs ${SMOKE_CONTAINER} ---"
          docker logs "${SMOKE_CONTAINER}" 2>&1 || true
          echo "--- end of container log ---"

      - name: Remove the smoke container
        if: always()
        run: docker rm -f "${SMOKE_CONTAINER}" > /dev/null 2>&1 || true

  publish:
    name: publish
    # The only job in this file that writes anything outside the run. It fires
    # on exactly two events and never on a pull request — a PR head is not a
    # release candidate, and a fork PR must not reach the registry at all:
    #
    #   * a `v*` tag  -> the service image's release lane;
    #   * a push to `main` -> a `sha-<short>` build, so every merged commit is
    #     pullable without minting a version.
    #
    # `startsWith(github.ref, 'refs/tags/v')` is also the cross-fire guard the
    # spec's edge-case list asks for: `refs/tags/searxng-v0.1.0` does not start
    # with `refs/tags/v`, so the companion image's tag (US-004) cannot trigger
    # the service lane. US-004's own lane keys off `refs/tags/searxng-v` for the
    # same reason, in the other direction.
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v'))
    # Every gate in the file, at once. `needs:` here is not the ordering
    # convenience it is elsewhere: it is the whole point of keeping these jobs
    # in one workflow. A tag pushed onto a red tree runs the gates, they fail,
    # and this job never starts.
    needs: [lint, typecheck, test, build-amd64, secret-grep, smoke]
    runs-on: ubuntu-latest
    # The one deliberate exception to this file's no-job-permissions rule, and
    # it is scoped to this job alone — the top-level grant stays `contents:
    # read`, so nothing else in the workflow can inherit either of these.
    #
    #   packages: write  — push to ghcr.io/washingbearlabs/forage.
    #   contents: write  — `gh release create`. Release creation 403s under the
    #                      top-level read-only default; a Release is a write to
    #                      the repository's contents, not to its packages.
    #
    # Neither is available to a fork PR: this job cannot run on a pull_request
    # event at all (see the `if:` above), and GitHub keeps a fork's token
    # read-only regardless.
    #
    # NOTE for whoever writes the next permissions block (US-004's searxng
    # lane): a job-level block **replaces** the top-level grant, it does not
    # merge with it. Ask for `packages: read` alone and you silently lose
    # `contents: read`, and `actions/checkout` then fails with `fatal:
    # repository '.../Forage/' not found` — a private-repo 404 that reads like a
    # typo rather than a permissions bug. This job gets away with listing no
    # `contents: read` only because `write` implies it. A guard test
    # (`test_a_job_that_scopes_permissions_and_checks_out_keeps_contents`)
    # enforces the rule for every future block.
    permissions:
      contents: write
      packages: write
    # The qemu-emulated arm64 leg is the long pole. Cold it is minutes of
    # emulated wheel installation and an emulated `import torch`; warm it is a
    # cache restore. A backstop, not a budget — docs/releases.md carries the
    # measured numbers and the trim rule.
    timeout-minutes: 60
    steps:
      # The build needs the source, and the Release step needs the tag. Same
      # `persist-credentials: false` as everywhere else: the two writes below
      # go through explicitly-passed tokens, never through a credential this
      # step left lying in the runner's git config.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        # Only needed for the emulated leg. Conditioned on the platform list so
        # that trimming `PUBLISH_PLATFORMS` back to amd64-only also drops the
        # emulator, rather than leaving a step that silently does nothing.
        if: contains(env.PUBLISH_PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Download the image artifact
        # This job is the *last* consumer of `build-amd64`'s artifact, and it
        # consumes it for a reason the other two do not share: it is the only
        # job in a position to check that what reaches the registry is the
        # filesystem `smoke` executed and `secret-grep` cleared. See the
        # verification step after the push.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: ${{ env.IMAGE_DOWNLOAD_DIR }}

      - name: Load the image and assert it is the one build-amd64 built
        # US-003's assertion, copied verbatim from `smoke` rather than
        # re-derived. `docker save`/`docker load` preserve the image ID exactly
        # — it is the digest of the image config — so a mismatch means this job
        # would be comparing the registry against a different image than the one
        # that was built, cleared and smoked.
        run: |
          set -euo pipefail
          recorded="$(tr -d '[:space:]' < "${IMAGE_DOWNLOAD_DIR}/${IMAGE_ID_FILE}")"
          if [ -z "${recorded}" ]; then
            echo "::error::${IMAGE_ID_FILE} carried no image ID"
            exit 1
          fi
          gunzip -c "${IMAGE_DOWNLOAD_DIR}/${IMAGE_TARBALL}" | docker load
          loaded="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          if [ "${loaded#sha256:}" != "${recorded#sha256:}" ]; then
            echo "::error::loaded image ${loaded} is not the ${recorded} build-amd64 recorded — this job would be publishing against a different image than the one that was gated"
            exit 1
          fi
          echo "Loaded ${IMAGE_REF} = ${loaded} (identical to build-amd64's)"

      - name: Record the gated filesystem
        # `RootFS.Layers` is the ordered list of *diff IDs* — the sha256 of each
        # layer's uncompressed tar. It is the image's filesystem, independent of
        # how any registry chose to compress it and independent of the image
        # config's metadata (exporter format, timestamps, labels). That makes it
        # the right thing to compare a rebuilt-and-pushed image against; see the
        # verification step below for why a rebuild is what happens.
        run: |
          set -euo pipefail
          docker image inspect --format '{{json .RootFS.Layers}}' "${IMAGE_REF}" \
            | jq -c '.' > gated-layers.json
          echo "Gated amd64 filesystem: $(jq -r 'length' gated-layers.json) layers"
          cat gated-layers.json

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # Every tag rule is written out, and `latest=false` turns off the
          # action's own automatic handling first. `latest=auto` would do
          # roughly the right thing, but "roughly" is not good enough for the
          # one tag whose accidental movement is a production incident: the
          # rule below is readable in one line and asserted by
          # tests/test_ci_workflow.py.
          #
          #   v1.2.3      -> 1.2.3, 1.2, latest
          #   v0.9.0-rc   -> 0.9.0-rc          (no 0.9, no latest)
          #   main        -> sha-<short>
          #
          # A pre-release is any tag carrying a `-`, which is exactly semver's
          # own definition. It moves neither `latest` nor the `X.Y` alias:
          # both are pointers consumers follow, and a release candidate is by
          # definition something no consumer should be followed into. `latest`
          # does not exist at all until the first non-pre-release `v*` tag,
          # which this spec's Assumptions place at `v1.0.0`.
          #
          # Every rule carries its own `enable=`, including the two that
          # `metadata-action` would no-op on anyway (a `type=semver` rule emits
          # nothing for a branch ref). Relying on that no-op would make the
          # policy readable only by someone who knows the action's internals,
          # and it is what the guard test caught when these were written
          # loosely: on a main push the `{{major}}.{{minor}}` rule was *live*
          # and merely produced no output. Stated explicitly, the four lines
          # answer "which tags does this ref publish?" on their own.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push the multi-arch image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PUBLISH_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # A multi-arch push cannot ship the tarball above: a manifest list is
          # built by buildx across platforms, and `docker load` puts a
          # single-platform image in a daemon buildx does not push from. So the
          # amd64 leg is *rebuilt* — from `type=gha`, the cache `build-amd64`
          # wrote with `mode=max` earlier in this same run, at this same commit,
          # off the same digest-pinned base and the same committed `uv.lock`.
          # Every amd64 layer is therefore served from cache rather than
          # re-executed, and the step after this one proves it: it compares the
          # published amd64 image's diff IDs against the ones the gated tarball
          # carried. "Cache-keyed, then verified" is the linkage; "the same
          # bytes were pushed" would not have been true.
          #
          # The second cache scope is where the arm64 layers live. They cannot
          # share `build-amd64`'s scope: that job writes an amd64-only manifest
          # on every run, so a shared scope would evict the emulated layers on
          # the next push and pay the cold qemu cost forever.
          cache-from: |
            type=gha
            type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          # Attestations are deliberately off. Image signing and provenance are
          # this spec's declared Out of Scope — the deferral is conscious, to be
          # revisited with real third-party consumers — and shipping the
          # producing half of that story without the verifying half would be
          # decoration. It also keeps the pushed artifact a plain manifest list,
          # which is what the verification below reads.
          provenance: false
          sbom: false

      - name: Verify the published amd64 image is the gated filesystem
        # THE point of this job downloading an artifact it cannot push.
        #
        # `smoke` executed a specific amd64 image and `secret-grep` read its
        # layer history. Neither says anything about what reached the registry
        # unless something ties the two together, and `needs:` does not: it is
        # an ordering edge. This does. The published amd64 manifest's config
        # carries `rootfs.diff_ids` — the uncompressed digest of every layer —
        # and they must equal the gated tarball's, layer for layer and in order.
        # Equal diff IDs mean an identical filesystem: same base, same wheels,
        # same source, byte for byte.
        #
        # What it deliberately does NOT claim: that the published image *is* the
        # loaded one. The image IDs differ, and legitimately — the config
        # records the exporter's own metadata — so asserting on them would be
        # asserting on a storage detail, which is the same mistake
        # `build-amd64`'s builder-vs-daemon note declines to make.
        #
        # FAILURE MODE: this runs after the push, because there is nothing to
        # inspect before it. If it fails, the tags exist but point at an image
        # that was never gated, the run is red, and — critically — the Release
        # step below never runs. A red publish is not a release; treat the tags
        # it left as untrusted and re-run once the cause is fixed.
        #
        # SCOPE: amd64 only. There is no arm64 artifact, because there is no
        # arm64 gate — nothing in this workflow has ever executed the emulated
        # leg. It is built from the same commit, the same lock and the same
        # digest-pinned multi-arch base, and that is the whole of the claim.
        # docs/releases.md says so to consumers rather than leaving it implied.
        env:
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
          PUSHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "${PUSHED_DIGEST}" ]; then
            echo "::error::the build step reported no pushed digest"
            exit 1
          fi
          published="${IMAGE_NAME}@${PUSHED_DIGEST}"
          echo "Inspecting ${published}"
          image_json="$(docker buildx imagetools inspect "${published}" --format '{{json .Image}}')"
          # A multi-platform push hands back a map keyed by platform; a
          # single-platform one hands back the config itself. Handle both, so
          # trimming PUBLISH_PLATFORMS does not quietly void this check.
          published_layers="$(
            printf '%s' "${image_json}" \
              | jq -c 'if has("linux/amd64") then .["linux/amd64"] else . end | .rootfs.diff_ids'
          )"
          gated_layers="$(cat gated-layers.json)"
          # Floor before comparing: if both sides ever degraded to `null` (a
          # jq miss on each), string equality would pass a comparison of
          # nothing against nothing. An empty gated list is itself the error.
          gated_count="$(printf '%s' "${gated_layers}" | jq -r 'if type == "array" then length else 0 end')"
          if [ "${gated_count}" -eq 0 ]; then
            echo "::error::gated layer list is empty or not an array — refusing a vacuous comparison"
            exit 1
          fi
          if [ "${published_layers}" != "${gated_layers}" ]; then
            echo "::error::the published amd64 filesystem is not the one that passed the gates"
            echo "gated:     ${gated_layers}"
            echo "published: ${published_layers}"
            exit 1
          fi
          echo "Published amd64 filesystem is identical to the gated one (${gated_count} layers)."
          # The rootfs parity above proves the *filesystem*. A `--build-arg`
          # or `ENV` secret would live in the image *config* — an empty layer
          # with identical diff_ids and a leaked history line — which is the
          # one place secret-grep's tarball read cannot see once the registry
          # copy exists. Same pattern set as secret-grep, applied to every
          # platform's published config (the inspect JSON carries them all).
          if printf '%s' "${image_json}" | grep -E -q 'HF_TOKEN|hf_[A-Za-z0-9]{20,}'; then
            echo "::error::the published image config carries a forbidden pattern"
            exit 1
          fi
          echo "No forbidden pattern in the published image config."
          echo "--- tags pushed for ${GITHUB_REF} ---"
          printf '%s\n' "${PUSHED_TAGS}"
          echo "--- end tags ---"

      - name: Create the GitHub Release
        # LAST, and only on a `v*` tag. The ordering is the contract: a Release
        # is created only after the image is pushed *and* verified, so a
        # published Release implies a pullable, gated image. The reverse is not
        # promised and does not need to be — a `main` push produces a
        # `sha-<short>` image and no Release at all.
        #
        # FAILURE MODE, push side: buildx uploads blobs, then the per-platform
        # manifests, then the index — and a tag only moves when the index lands.
        # An interrupted push therefore leaves orphan blobs rather than a
        # half-formed tag, and re-running the same tag re-pushes, skipping every
        # blob the registry already holds. Re-running a failed publish is safe.
        #
        # FAILURE MODE, this step: if the push succeeded and this fails, the
        # image is live and the Release is missing. That is the harmless
        # direction, and it is recoverable by re-running the job; the direction
        # that would matter — a Release advertising an image nobody can pull —
        # is the one the ordering rules out.
        #
        # `gh` is preinstalled on GitHub-hosted runners, so this needs no
        # fourth-party action for a two-line API call.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Same pre-release rule as the tag policy above, and deliberately the
          # same one-character test: a tag carrying a `-` is a semver
          # pre-release, is marked as such on the Release, and moved neither
          # `latest` nor the `X.Y` alias.
          release_args=(--repo "${RELEASE_REPO}" --title "${RELEASE_TAG}")
          case "${RELEASE_TAG}" in
            *-*) release_args+=(--prerelease) ;;
          esac
          notes="$(cat <<EOF
          Published image: \`${IMAGE_NAME}:${RELEASE_TAG#v}\`

          Digest: \`${PUSHED_DIGEST}\`
          Platforms: \`${PUBLISH_PLATFORMS}\`

          Built and pushed by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${RELEASE_REPO}/actions/runs/${GITHUB_RUN_ID})
          after lint, typecheck, test, build-amd64, secret-grep and smoke all
          passed on this commit. The published amd64 layers were verified
          identical to the image the contract smoke executed.
          EOF
          )"
          gh release create "${RELEASE_TAG}" "${release_args[@]}" --notes "${notes}"
          echo "Release ${RELEASE_TAG} created after the image push."
